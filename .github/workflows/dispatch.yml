name: Dispatch generated site
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'REBUILD.md'
permissions:
  contents: read
jobs:
  dispatch-generated-site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the exact registry commit
        env:
          SITE_REPO: staz0t/pwnreq-fi-site-951d2bc0
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '{event_type:"on-registry-trigger",client_payload:{registryRepo:$repo,registryCommit:$sha}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SITE_REPO/dispatches" \
            -d "$payload"
